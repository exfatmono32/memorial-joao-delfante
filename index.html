<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memorial João Delfante</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    .nome-principal {
      font-family: "Cormorant Garamond", serif !important;
    }

    .intro-screen {
      position: fixed;
      inset: 0;
      background: #e9eaec;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
      animation: introFadeOut 0.9s ease forwards;
      animation-delay: 5s;
    }

    .intro-text-wrap {
      position: relative;
      width: min(1000px, 92vw);
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .intro-memorial,
    .intro-name {
      position: absolute;
      margin: 0;
      color: #111;
      text-align: center;
      white-space: nowrap;
      opacity: 0;
    }

    /* 1º texto */
    .intro-memorial {
      font-family: "Cinzel", serif;
      font-size: clamp(2rem, 4.8vw, 4rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      animation: memorialSolo 2.2s ease forwards;
    }

    /* 2º texto */
    .intro-name {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(3.5rem, 8vw, 6.8rem);
      line-height: 0.95;
      animation: nameSolo 2.2s ease forwards;
      animation-delay: 2.2s;
    }

    .home-container {
      opacity: 0;
      transform: translateY(10px);
      animation: showHome 0.8s ease forwards;
      animation-delay: 5.1s;
    }

    @keyframes memorialSolo {
      0% {
        opacity: 0;
        transform: scale(1);
        filter: blur(8px);
      }
      20% {
        opacity: 1;
        filter: blur(2px);
      }
      70% {
        opacity: 1;
        transform: scale(0.94);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: scale(0.88);
        filter: blur(3px);
      }
    }

    @keyframes nameSolo {
      0% {
        opacity: 0;
        transform: scale(0.82);
        filter: blur(8px);
      }
      25% {
        opacity: 1;
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
    }

    @keyframes introFadeOut {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    @keyframes showHome {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="home-page">
  <div class="intro-screen" aria-hidden="true">
    <div class="intro-text-wrap">
      <h2 class="intro-memorial">Memorial</h2>
      <h1 class="intro-name">João Delfante</h1>
    </div>
  </div>

  <main class="home-container">
    <header class="hero">
      <p class="hero-small">MEMORIAL</p>
      <h1 class="nome-principal">JOÃO DELFANTE</h1>
    </header>

    <nav class="menu-grid" aria-label="Seções do memorial">
      <a class="menu-button" href="homenagens.html">Homenagens</a>
      <a class="menu-button" href="materias-jornais.html">Matérias Jornalísticas</a>
      <a class="menu-button" href="sua-historia.html">Sua história</a>
      <a class="menu-button" href="materias-videos.html">Reportagens</a>
      <a class="menu-button" href="memorias.html">Memórias</a>
      <a class="menu-button" href="missao.html">Missão</a>
    </nav>
  </main>
</body>
</html>
